plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    // 国内镜像优先。
    maven {
        name = 'AliyunPublic'
        url = 'https://maven.aliyun.com/repository/public'
    }
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // Forge Config API Port: required at runtime on this loader. The published Fabric jar
    // already ships in the official mappings this target compiles against, so a plain
    // compileOnly is enough and Loom remaps the produced jar as usual.
    compileOnly files("${rootDir}/libs/${fcap_jar}")

    // Optional Mod Menu API (client only): the config button of the mod list. Compile time
    // only, the entrypoint is only loaded when Mod Menu is installed.
    compileOnly("com.terraformersmc:modmenu:20.0.3")

    // The common sources are recompiled inside this module, so their compile time
    // dependencies have to be here as well. Jade is vendor-provided and compile only:
    // 26.x has no Fabric Jade artifact on any reachable Maven for this machine, and the
    // Jade provider is shared code (the NeoForge jar exposes the same API classes).
    compileOnly files("${rootDir}/libs/${jade_jar}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
configurations.matching { it.name in ['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'] }.configureEach {
    attributes {
        attribute(loaderAttribute, 'fabric')
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
