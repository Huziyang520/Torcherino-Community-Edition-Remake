plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    // Mod Menu lives here. It is the Fabric counterpart of Configured: it turns the
    // factory registered below into the "config" button on the mod list entry.
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    // Jade (Waila) API.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Optional: only needed at compile time, the entrypoint is only loaded when Mod Menu
    // is actually installed.
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    // Forge Config API Port and Neo Configuration Screen Port: both required at runtime on
    // this loader. Loom remaps these Fabric artifacts from intermediary to the project
    // mappings, which is what puts their classes on the compile classpath.
    modCompileOnly files("${rootDir}/libs/${fcap_jar}")
    modCompileOnly files("${rootDir}/libs/${screen_port_jar}")
    // Optional: Jade (Waila) API. Loom remaps the Fabric artifact from intermediary, so the
    // plugin entrypoint only loads when Jade is installed.
    modCompileOnly "maven.modrinth:jade:${jade_version}+fabric"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}
