plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    // 国内镜像优先；Cloth Config API 只有官方源。
    maven {
        name = 'AliyunPublic'
        url = 'https://maven.aliyun.com/repository/public'
    }
    mavenCentral()
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // Optional: Cloth Config API, compile time only. The Fabric entry point only registers
    // the config screen factory when the mod is present at runtime; nothing is bundled.
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}")

    // Optional Mod Menu API (client only): the config button of the mod list. Compile time
    // only, the entrypoint is only loaded when Mod Menu is installed.
    compileOnly("com.terraformersmc:modmenu:20.0.3")

    // The common sources are recompiled inside this module, so their compile time
    // dependencies have to be here as well. Jade is vendor-provided and compile only:
    // 26.x has no Fabric Jade artifact on any reachable Maven for this machine, and the
    // Jade provider is shared code (the NeoForge jar exposes the same API classes).
    compileOnly files("${rootDir}/libs/jade-neoforge-26.1-26.2.jar")
    compileOnly group: 'com.electronwill.night-config', name: 'core', version: '3.6.4'
    compileOnly group: 'com.electronwill.night-config', name: 'toml', version: '3.6.4'
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
configurations.matching { it.name in ['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'] }.configureEach {
    attributes {
        attribute(loaderAttribute, 'fabric')
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
