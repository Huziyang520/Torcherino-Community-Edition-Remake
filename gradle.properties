# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.6.0
group=com.sci.torcherino
java_version=17

# Common
minecraft_version=1.20.1
# Slug of the supported Minecraft range, used only for the artifact file name
# (torcherino-forge-1.20-1.20.1-<version>.jar). Never used in any template.
minecraft_version_slug=1.20-1.20.1
mod_name=Torcherino Community Edition Remake
mod_author=Huziyang520
mod_id=torcherino
license=AGPL-3.0
credits=Original Torcherino by Scitoshi Nakayobro; maintained by LukeGrahamLandry; Community Edition by artiks4471
description=[EN]Torcherino Community Edition restores the content of the classic version and adds some new content. \\n[CN] \u8fd8\u539f\u52a0\u901f\u706b\u628a\u793e\u533a\u7248\u7ecf\u5178\u7248\u672c\u7684\u5185\u5bb9\uff0c\u5e76\u65b0\u589e\u4e86\u4e00\u4e9b\u65b0\u5185\u5bb9\u3002 \\nFeedback: https://github.com/Huziyang520/Torcherino-Community-Edition-Remake/issues | https://issue.mengcai.online/
minecraft_version_range=[1.20,1.20.2)
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9
# Optional Fabric mod menu (the Fabric counterpart of Configured).
modmenu_version=7.2.2
# Optional Cloth Config API. Compile time only: the configuration screen is built with it
# when it is installed, it is never bundled and never required.
cloth_config_version=11.1.136
# Optional Jade (Waila) integration: the block tooltip gains the multiplier, the state and the
# owner. Compile time only as well - Jade is never bundled and never required. The loader
# suffix ( "+forge" / "+fabric" ) is appended where the dependency is declared.
jade_version=11.13.3

# Forge
forge_version=47.2.30
forge_loader_version_range=[47,)

# Gradle
# en locale + UTF-8 keep javac diagnostics readable in this shell.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
