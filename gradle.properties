# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.6.0
group=com.sci.torcherino
java_version=25

# Common
# 本分支覆盖 26.1 ~ 26.2：按较低版 26.1.2 编译，一个 jar 同时支持两版。
minecraft_version=26.3
# Slug of the supported Minecraft range, used only for the artifact file name
# (torcherino-neoforge-26.1-26.2-<version>.jar). Never used in any template.
minecraft_version_slug=26.3
mod_name=Torcherino Community Edition Remake
mod_author=Huziyang520
mod_id=torcherino
license=AGPL-3.0
credits=Original Torcherino by Scitoshi Nakayobro; maintained by LukeGrahamLandry; Community Edition by artiks4471
description=[EN] Torcherino Community Edition restores the content of the classic version and adds some new content. [CN] 还原加速火把社区版经典版本的内容，并新增了一些新内容。 Issues: https://github.com/Huziyang520/Torcherino-Community-Edition-Remake/issues | https://issue.mengcai.online/
minecraft_version_range=[26.3,26.4)
# NeoForm version of the compile base (26.1.2 is the lower bound of this branch).
neo_form_version=26.3-1

# Fabric
fabric_version=0.160.6+26.3
fabric_loader_version=0.19.5
# Optional Cloth Config API. Compile time only: the configuration screen is built with it
# when it is installed, it is never bundled and never required.
cloth_config_version=26.3.159

# NeoForge
neoforge_version=26.3.0.1-beta
neoforge_loader_version_range=[4,)

# Gradle
# en locale + UTF-8 keep javac diagnostics readable in this shell.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
