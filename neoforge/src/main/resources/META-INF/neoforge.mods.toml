# 本分支只覆盖 26.3：modLoader / loaderVersion 在 26.3 起降级为可选，仍按旧写法写全。
modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
# displayURL / issueTrackerURL / 图标字段必须写在 [[mods]] 子表内；写在顶层会被
# NeoForge 静默忽略，模组列表的“主页 / 问题”按钮点不动。
displayURL="https://www.curseforge.com/minecraft/mc-mods/torcherino-community-edition-remake"
issueTrackerURL="https://github.com/Huziyang520/Torcherino-Community-Edition-Remake/issues"
# 26.2 起读 iconFile（logoFile 已废弃）；为兼容旧解析器两个都写。
logoFile="${mod_id}.png"
iconFile="${mod_id}.png"
authors="${mod_author}"
credits="${credits}"
description='''${description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[26.3,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
# 可选前置：装了 Jade 才显示倍率 / 状态 / 所有者行。
modId="jade"
type="optional"
versionRange="[26.1,)"
ordering="AFTER"
side="CLIENT"
