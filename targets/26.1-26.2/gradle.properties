# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.
#
# This file belongs to one target (targets/<target>/). The sources live in the repository root
# (common/, fabric/, neoforge/) and are shared by every target; only this file and the optional
# targets/<target>/overlay tree differ per Minecraft version.

# Project
version=1.7.0
group=com.sci.torcherino
java_version=25

# Common
# This target covers 26.1 / 26.1.1 / 26.1.2 / 26.2, compiled against the lower bound 26.1.2.
minecraft_version=26.1.2
# Slug of the supported Minecraft range, used only for the artifact file name
# (torcherino-neoforge-26.1-26.2-<version>.jar). Never used in any template.
minecraft_version_slug=26.1-26.2
mod_name=Torcherino Community Edition Remake
mod_author=Huziyang520
mod_id=torcherino
license=AGPL-3.0
credits=Original Torcherino by Scitoshi Nakayobro; maintained by LukeGrahamLandry; Community Edition by artiks4471
description=[EN] Torcherino Community Edition restores the content of the classic version and adds some new content. [CN] 还原加速火把社区版经典版本的内容，并新增了一些新内容。 Issues: https://github.com/Huziyang520/Torcherino-Community-Edition-Remake/issues | https://issue.mengcai.online/
# Version range as Maven writes it (mods.toml dependencies) and as Fabric writes it (fabric.mod.json).
minecraft_version_range=[26.1,26.3)
minecraft_version_range_fabric=>=26.1 <26.3
# NeoForm version of the compile base.
neo_form_version=26.1.2-1
# "neoforge" resolves the patched Minecraft from the NeoForge artifact, "neoform" pins
# neo_form_version instead.
compile_base=neoform

# Fabric
fabric_version=0.155.2+26.1.2
fabric_loader_version=0.18.6
# Optional Cloth Config API. Compile time only: the configuration screen is built with it
# when it is installed, it is never bundled and never required.
cloth_config_version=26.2.155

# NeoForge
neoforge_version=26.1.2.94
neoforge_loader_version_range=[4,)
# Range of the required neoforge dependency in mods.toml.
neoforge_dependency_range=[26.1,26.3)

# Vendored compile-only jars, resolved from targets/<target>/libs/ (git ignored).
cloth_jar=cloth-config-neoforge-26.1.154.jar
jade_jar=jade-neoforge-26.1-26.2.jar

# Optional source overlay of this target, relative to targets/<target>/. Empty = no overlay.
target_overlay=overlay

# Gradle
# en locale + UTF-8 keep javac diagnostics readable in this shell.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
