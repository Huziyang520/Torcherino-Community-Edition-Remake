plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    // The shared sources declare their config with ForgeConfigSpec, so this project needs the
    // loader API on its classpath and not just the vanilla classes.
    version = "${minecraft_version}-${forge_version}"
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    // No Mixin is used anywhere in this mod, so the template's mixin dependency was removed.
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    // Jade (Waila) API, optional. The API package is loader independent; the Forge artifact
    // is the one the common sources compile against.
    compileOnly "maven.modrinth:jade:${jade_version}+forge"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
