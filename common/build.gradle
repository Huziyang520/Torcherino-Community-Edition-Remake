plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    // The shared sources declare their config with ModConfigSpec, so this module needs the
    // loader API on its classpath; Fabric maps the same classes through Forge Config API Port.
    version = neo_version
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    // No Mixin is used anywhere in this mod, so the template's mixin dependency was removed.
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    // Jade (Waila) API, optional. The API is loader independent, but the jar has to be the
    // official-mapping (NeoForge) one: the Fabric artifact is intermediary remapped and its
    // method descriptors cannot be compiled against official mappings. See libs/README.txt.
    compileOnly files("${rootDir}/libs/jade-neoforge-1.21.1.jar")
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
