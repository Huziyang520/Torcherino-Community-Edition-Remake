plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    // Vanilla Minecraft classes only: the common project must not see the loader API.
    neoFormVersion = neo_form_version
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    // No Mixin is used anywhere in this mod, so the template's mixin dependency was removed.
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    // TOML configuration for the Fabric side. NeoForge ships night-config at runtime; the
    // common sources are compiled in both loader projects, so it is needed here as well.
    compileOnly group: 'com.electronwill.night-config', name: 'core', version: '3.6.4'
    compileOnly group: 'com.electronwill.night-config', name: 'toml', version: '3.6.4'
    // Jade (Waila) API, optional. The API is loader independent, but the jar has to be the
    // official-mapping (NeoForge) one: the Fabric artifact is intermediary remapped and its
    // method descriptors cannot be compiled against official mappings. See libs/README.txt.
    compileOnly files("${rootDir}/libs/jade-neoforge-1.21.1.jar")
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
