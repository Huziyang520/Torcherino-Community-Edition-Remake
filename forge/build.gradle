plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common")
    // Forge ships night-config at runtime; it is only needed on the compile classpath
    // because the common sources are compiled a second time inside this project.
    compileOnly group: 'com.electronwill.night-config', name: 'core', version: '3.6.4'
    compileOnly group: 'com.electronwill.night-config', name: 'toml', version: '3.6.4'
    // Cloth Config API, optional: the mod list config button is only registered when the mod
    // is present at runtime.
    compileOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"
    // Jade (Waila) API, optional: the plugin class is only loaded by Jade itself.
    compileOnly "maven.modrinth:jade:${jade_version}+forge"
}

jar {
    finalizedBy('reobfJar')
}
