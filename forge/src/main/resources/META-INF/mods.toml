modLoader = "javafml" #mandatory
loaderVersion = "${forge_loader_version_range}" #mandatory
license = "${license}"
issueTrackerURL = "https://github.com/Huziyang520/Torcherino-Community-Edition-Remake/issues"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
credits = "${credits}"
description = "${description}" #use \n inside gradle.properties for a line break; a real newline is invalid here
logoFile = "${mod_id}.png"
displayURL = "https://github.com/Huziyang520/Torcherino-Community-Edition-Remake"
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
